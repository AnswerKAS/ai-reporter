name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/deploy/ai-reporter
  SERVICE_NAME: ai-reporter

jobs:
  build:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: "Frontend: lint + build"
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: "Backend: зависимости + smoke-импорт"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, '.'); import app.main; print('backend import ok')"

      - name: Загрузить frontend/dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  deploy:
    name: Деплой на VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Настроить SSH (ключ + known_hosts)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # параметры в config, а не в командной строке: rsync передаёт строку
          # --rsh в exec без раскрытия ~, а ssh свой config читает сам
          {
            printf 'Host %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '  IdentityFile ~/.ssh/id_deploy\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Проверка SSH-доступа
        env:
          SERVER: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh -v -o ConnectTimeout=15 \
            $SERVER 'echo SSH-OK' 2>&1 | tee /tmp/ssh-check.log | tail -5
          grep -q "SSH-OK" /tmp/ssh-check.log && echo "✓ SSH-подключение работает" || {
            echo "::error::SSH не подключился — см. /tmp/ssh-check.log ниже"
            grep -E "Authentications that|Permission denied|Host key verification|Connection (timed out|refused|reset)|invalid user|docker: " /tmp/ssh-check.log || true
            exit 1
          }

      - name: Синхронизация кода (rsync)
        env:
          SERVER: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          RSH="ssh"
          rsync -az --delete --rsh="$RSH" backend/app/      $SERVER:$APP_DIR/backend/app/
          rsync -az           --rsh="$RSH" backend/requirements.txt $SERVER:$APP_DIR/backend/
          rsync -az --delete --rsh="$RSH" frontend/dist/    $SERVER:$APP_DIR/frontend/dist/
          rsync -az --delete --rsh="$RSH" deploy/           $SERVER:$APP_DIR/deploy/

      - name: Установка зависимостей и перезапуск сервиса
        env:
          SERVER: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh $SERVER \
            "cd $APP_DIR/backend && .venv/bin/pip install -q -r requirements.txt && sudo systemctl restart $SERVICE_NAME && systemctl is-active $SERVICE_NAME"
