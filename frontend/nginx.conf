# nginx внутри контейнера frontend: статика SPA + прокси API в сервис backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # загрузка CSV-датасетов: дефолтный лимит nginx в 1 МБ её обрезает
    client_max_body_size 200m;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Forward stream heartbeats immediately through both proxy layers.
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # генерация отчётов и диалог с моделью могут ждать дольше обычного
        proxy_read_timeout 300s;
    }
}
