# Proxmox observability stack using the existing Garage S3 service.
# docker compose --env-file langfuse/.env -f langfuse/compose.proxmox.yml up -d
name: ai-reporter-langfuse

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://langfuse:${LF_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
  SALT: ${LF_SALT}
  ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LF_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-ai-reporter
  LANGFUSE_S3_EVENT_UPLOAD_REGION: garage
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://192.168.100.50:3900
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LF_S3_ACCESS_KEY_ID}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_S3_SECRET_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-ai-reporter
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: garage
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://192.168.100.50:3900
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LF_S3_ACCESS_KEY_ID}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_S3_SECRET_ACCESS_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  langfuse-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LF_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${LF_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: &langfuse-dependencies
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_PUBLIC_URL:-http://192.168.1.61:3900}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://192.168.100.50:3900
      LANGFUSE_INIT_ORG_ID: ai-reporter
      LANGFUSE_INIT_ORG_NAME: AI Reporter
      LANGFUSE_INIT_PROJECT_ID: ai-reporter
      LANGFUSE_INIT_PROJECT_NAME: AI Reporter Agents
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LF_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LF_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    networks:
      - default
      - reporter

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:

networks:
  reporter:
    external: true
    name: ${APP_DOCKER_NETWORK:-ai-reporter_default}
