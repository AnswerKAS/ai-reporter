[request_definition]
r = sub, obj, act

[policy_definition]
p = act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.act == p.act && (r.sub.role == "admin" || (r.act == "view" && (r.sub.id == r.obj.owner || assigned(r.sub, r.obj) || tagged(r.sub, r.obj))) || (r.act == "metadata" && (r.sub.id == r.obj.owner || assigned(r.sub, r.obj) || tagged(r.sub, r.obj))) || (r.act == "filters" && (r.sub.id == r.obj.owner || assigned(r.sub, r.obj) || tagged(r.sub, r.obj))) || (r.act == "tags" && r.sub.id == r.obj.owner))
